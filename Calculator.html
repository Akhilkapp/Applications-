<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e0f7fa, #c5cae9);
    }

    .calculator {
      width: 320px;
      background: #1f2937;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
    }

    .display {
      width: 100%;
      height: 70px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 2rem;
      text-align: right;
      padding: 10px 14px;
      margin-bottom: 16px;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .operator {
      background: #f59e0b;
      color: white;
    }

    .number {
      background: #e5e7eb;
      color: #111827;
    }

    .clear {
      background: #ef4444;
      color: white;
    }

    .equal {
      background: #10b981;
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input id="display" class="display" type="text" readonly />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button class="operator" onclick="appendValue('*')">×</button>
      <button class="operator" onclick="backspace()">⌫</button>

      <button class="number" onclick="appendValue('7')">7</button>
      <button class="number" onclick="appendValue('8')">8</button>
      <button class="number" onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button class="number" onclick="appendValue('4')">4</button>
      <button class="number" onclick="appendValue('5')">5</button>
      <button class="number" onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button class="number" onclick="appendValue('1')">1</button>
      <button class="number" onclick="appendValue('2')">2</button>
      <button class="number" onclick="appendValue('3')">3</button>
      <button class="equal" onclick="calculate()">=</button>

      <button class="number" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button class="number" onclick="appendValue('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      const current = display.value;
      const lastChar = current[current.length - 1];

      // Prevent invalid consecutive operators
      if (['+', '-', '*', '/'].includes(value) && ['+', '-', '*', '/'].includes(lastChar)) {
        return;
      }

      display.value = current + value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function backspace() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      const expression = display.value.trim();

      if (!expression) return;

      // Allow only numbers, operators, and decimal points
      const validPattern = /^[0-9+\-*/.]+$/;
      if (!validPattern.test(expression)) {
        display.value = 'Error';
        return;
      }

      try {
        const result = Function(`"use strict"; return (${expression});`)();
        display.value = Number.isFinite(result) ? result : 'Error';
      } catch {
        display.value = 'Error';
      }
    }

    // Optional keyboard support
    document.addEventListener('keydown', (e) => {
      const key = e.key;

      if (/^[0-9]$/.test(key)) appendValue(key);
      else if (['+', '-', '*', '/'].includes(key)) appendValue(key);
      else if (key === '.') appendValue('.');
      else if (key === 'Enter' || key === '=') calculate();
      else if (key === 'Backspace') backspace();
      else if (key === 'Escape') clearDisplay();
    });
  </script>
</body>
